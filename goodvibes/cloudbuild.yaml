steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "us-central1-docker.pkg.dev/$PROJECT_ID/goodvibes/app:$SHORT_SHA", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "us-central1-docker.pkg.dev/$PROJECT_ID/goodvibes/app:$SHORT_SHA"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args: ["run", "deploy", "goodvibes", "--image", "us-central1-docker.pkg.dev/$PROJECT_ID/goodvibes/app:$SHORT_SHA",
           "--region", "us-central1", "--allow-unauthenticated", "--memory", "4Gi", "--cpu", "2",
           "--min-instances", "1", "--set-secrets", "GEMINI_API_KEY=GEMINI_API_KEY:latest"]
images: ["us-central1-docker.pkg.dev/$PROJECT_ID/goodvibes/app:$SHORT_SHA"]
